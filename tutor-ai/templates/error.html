<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }} | Tutor AI Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/templatemo-621-luminary-style.css') }}">
</head>
<body>

<svg class="grain" width="100%" height="100%">
  <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="5" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  <rect width="100%" height="100%" filter="url(#n)"/>
</svg>
<div class="atmosphere"></div>

<main class="main">
  <section class="hero" id="error-hero">
    <h1>{{ title }}</h1>
    <p class="hero-sub">{{ message }}</p>
    <div class="hero-ctas">
      <a href="{{ url_for('index') }}" class="btn-primary">Return to Dashboard</a>
    </div>
  </section>
</main>

</body>
</html>
